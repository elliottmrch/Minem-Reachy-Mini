[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"


[project]
name = "coquille"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "reachy-mini",
    "fastapi",
    "uvicorn[standard]",
    "python-multipart",
    "yt-dlp",
    "mediapipe",
    "opencv-python",
    "numpy"
]
keywords = ["reachy-mini-app"]

[project.entry-points."reachy_mini_apps"]
reachy_minem = "coquille.main:ReachyMinem"

[tool.setuptools]
package-dir = { "" = "." }
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools.package-data]
coquille = ["**/*"] # Also include all non-.py files