<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <title>Coquille - Pipeline vidéo -> robot</title>
    <meta content="width=device-width, initial-scale=1" name="viewport">
    <link href="/static/style.css" rel="stylesheet">
</head>

<body>
    <h1>Coquille — Pipeline vidéo → robot</h1>
    <p class="subtitle">Importez une vidéo, lancez le pipeline, puis rejouez le mouvement sur le robot en
        synchronisation avec la vidéo.</p>

    <section class="step">
        <h2><span class="step-num">1</span> Choisir une vidéo</h2>
        <div class="row">
            <input accept="video/mp4" id="file-input" type="file">
            <button id="upload-btn">Upload</button>
        </div>
        <div class="separator">ou</div>
        <div class="row">
            <input id="yt-input" placeholder="https://www.youtube.com/watch?v=..." type="text">
            <button id="yt-btn">⬇ YouTube</button>
        </div>
        <div class="separator">ou</div>
        <div class="row">
            <select id="cached-select">
                <option value="">— Vidéos déjà traitées —</option>
            </select>
            <button disabled id="cached-load-btn">Charger</button>
        </div>
        <p class="info" id="upload-info">Aucune vidéo chargée</p>
    </section>

    <section class="step">
        <h2><span class="step-num">2</span> Traiter la vidéo</h2>
        <div class="row">
            <button disabled id="process-btn">Lancer le pipeline</button>
            <progress hidden id="process-progress" max="100" value="0"></progress>
        </div>
        <p class="info" id="process-info">En attente d'une vidéo</p>
    </section>

    <section class="step">
        <h2><span class="step-num">3</span> Rejouer (robot + vidéo synchrones)</h2>
        <video controls muted id="video-player" preload="metadata"></video>
        <div class="row">
            <button disabled id="play-btn">▶ Play</button>
            <button disabled id="stop-btn">⏹ Stop</button>
        </div>
    </section>

    <div id="status-bar">Statut : prêt</div>

    <script src="/static/main.js"></script>
</body>

</html>
